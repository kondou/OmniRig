;-------------------------------------------------------------------------------
;                   Kenwood TS-590SG - VFO B (Rig2用)
;
;   共有ポートモード用。Rig2として使用。
;   AI2モードでポーリングなし（Poll Int. = 0 を設定すること）
;   WriteCommandは意図的に定義しない（SDRからの誤操作防止）
;
;   ペアファイル: TS-590SG_VFOA.ini (Rig1用、同じCOMポートを指定)
;   注意: INITは定義しない。Rig1(VFOA)がAI2;を送出済みのため。
;
;   STATUS3(MD)はDispatchAIData経由でRig2に渡されたMDを処理するために必要。
;-------------------------------------------------------------------------------

[INIT]
; なし - Rig1(TS-590SG_VFOA)がAI2;を送出済み

;-------------------------------------------------------------------------------
; VFO B周波数 -> pmFreq
; FB応答: FB00014195000; (14バイト + ;)
;-------------------------------------------------------------------------------
[STATUS1]
Command=(FB;)
ReplyEnd=(;)
Validate=(FB...........;)
Value1=2|11|vfText|1|0|pmFreq

;-------------------------------------------------------------------------------
; 受信VFO -> VFO B (pmVfoBB)
; FR1; のときのみマッチ。FR0; は無視（Rig1が担当）。
;-------------------------------------------------------------------------------
[STATUS2]
Command=(FR;)
ReplyEnd=(;)
Validate=(FR.;)
Flag1=(..1.)|pmVfoBB

;-------------------------------------------------------------------------------
; モード -> DispatchAIData経由でRig2に渡されたMDを処理する
;-------------------------------------------------------------------------------
[STATUS3]
Command=(MD;)
ReplyEnd=(;)
Validate=(MD.;)
Flag1=(..1.)|pmSSB_L
Flag2=(..2.)|pmSSB_U
Flag3=(..3.)|pmCW_U
Flag4=(..4.)|pmFM
Flag5=(..5.)|pmAM
Flag6=(..6.)|pmDIG_L
Flag7=(..7.)|pmCW_L
Flag8=(..9.)|pmDIG_U
