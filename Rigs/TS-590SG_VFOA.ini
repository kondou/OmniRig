;-------------------------------------------------------------------------------
;                   Kenwood TS-590SG - VFO A (Rig1用)
;
;   共有ポートモード用。Rig1として使用。
;   AI2モードでポーリングなし（Poll Int. = 0 を設定すること）
;   WriteCommandは意図的に定義しない（SDRからの誤操作防止）
;
;   ペアファイル: TS-590SG_VFOB.ini (Rig2用、同じCOMポートを指定)
;
;   STATUS3(MD)はDispatchAIData経由でRig1に渡されたMDを処理するために必要。
;   Rig1のRecvEventでのMD直接処理はCustRig.pasでスキップされる。
;-------------------------------------------------------------------------------

[INIT]
Command=(AI2;)
ReplyLength=0

;-------------------------------------------------------------------------------
; VFO A周波数 -> pmFreq
; FA応答: FA00014195000; (14バイト + ;)
;-------------------------------------------------------------------------------
[STATUS1]
Command=(FA;)
ReplyEnd=(;)
Validate=(FA...........;)
Value1=2|11|vfText|1|0|pmFreq

;-------------------------------------------------------------------------------
; 受信VFO -> VFO A (pmVfoAA)
; FR0; のときのみマッチ。FR1; は無視（Rig2が担当）。
;-------------------------------------------------------------------------------
[STATUS2]
Command=(FR;)
ReplyEnd=(;)
Validate=(FR.;)
Flag1=(..0.)|pmVfoAA

;-------------------------------------------------------------------------------
; モード -> DispatchAIData経由でRig1に渡されたMDを処理する
; Rig1のRecvEvent内ではスキップされ、DispatchSlaveAIData経由でのみ適用される
;-------------------------------------------------------------------------------
[STATUS3]
Command=(MD;)
ReplyEnd=(;)
Validate=(MD.;)
Flag1=(..1.)|pmSSB_L
Flag2=(..2.)|pmSSB_U
Flag3=(..3.)|pmCW_U
Flag4=(..4.)|pmFM
Flag5=(..5.)|pmAM
Flag6=(..6.)|pmDIG_L
Flag7=(..7.)|pmCW_L
Flag8=(..9.)|pmDIG_U
